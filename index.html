<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divine Osuji Work</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef6ff, #f8fafc);
      color: #0f172a;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 24px;
      margin-bottom: 24px;
    }

    h1, h2, h3 { margin-top: 0; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
    }

    .badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input, select, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 16px;
    }

    button {
      background: #087f5b;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    button:hover { opacity: 0.95; }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    li {
      margin: 10px 0;
      line-height: 1.5;
    }

    .small {
      color: #475569;
      font-size: 14px;
    }

    .answer-box {
      margin-top: 18px;
      padding: 12px;
      background: #eff6ff;
      border-radius: 10px;
      color: #1e3a8a;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>Divine Osuji Work</h1>
      <span class="badge">Demo</span>
    </div>

    <section class="card">
      <h2>Volunteer Poll</h2>
      <label for="attendance">Choose an option</label>
      <select id="attendance">
        <option value="">Choose an option</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
      <button id="submitBtn" type="button">Submit</button>
      <div id="answerBox" class="answer-box" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>School Attendance System</h2>
      <form id="attendanceForm">
        <input type="text" id="studentName" placeholder="Full name" required />
        <input type="text" id="studentID" placeholder="Student ID" required />
        <select id="course">
          <option>Introduction to Programming</option>
          <option>Mathematics</option>
          <option>Computer Networks</option>
        </select>
        <button type="submit">Mark Attendance</button>
      </form>

      <h3>Attendance Register</h3>
      <ul id="attendanceList"></ul>
    </section>
  </div>

  <script>
    const form = document.getElementById('attendanceForm');
    const list = document.getElementById('attendanceList');
    const records = [];

    document.getElementById('submitBtn').addEventListener('click', function () {
      const answer = document.getElementById('attendance').value;
      const box = document.getElementById('answerBox');

      if (!answer) {
        alert('Please choose Yes or No.');
        return;
      }

      box.textContent = 'Your answer is: ' + answer;
      box.style.display = 'block';
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const name = document.getElementById('studentName').value.trim();
      const id = document.getElementById('studentID').value.trim();
      const course = document.getElementById('course').value;

      const alreadyMarked = records.some(
        record => record.id.toLowerCase() === id.toLowerCase() && record.course === course
      );

      if (alreadyMarked) {
        alert('You have already marked attendance!');
        return;
      }

      const time = new Date().toLocaleString();
      records.push({ name, id, course, time });

      const item = document.createElement('li');
      item.textContent = `${name} (${id}) - ${course} - Present at ${time}`;
      list.appendChild(item);

      alert('Attendance marked successfully!');
      form.reset();
    });
  </script>
</body>
</html>
